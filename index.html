<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Klepet z Izbiro Datuma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 600px;
        }
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.ai {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fff;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background-color: #0056b3;
        }
        /* Poseben stil za vdelan koledar / gumb */
        .calendar-widget {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            padding: 10px;
            border-radius: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .calendar-widget input[type="date"] {
            padding: 8px;
            border: 1px solid #007bff;
            border-radius: 4px;
            font-size: 14px;
        }
        .calendar-widget button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .calendar-widget button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Asistent z izbiro datuma</div>
    
    <div class="chat-messages" id="chatMessages">
        <!-- AI začetno sporočilo -->
        <div class="message ai">Pozdravljeni! Za začetek rezervacije mi prosim povejte, katerega datuma bi želeli termin?</div>
        
        <!-- Prikaz interaktivnega koledarja takoj ob začetku ali ko AI vpraša -->
        <div class="message ai" id="calendarPromptMessage">
            Prosimo, izberite datum s pomočjo spodnjega koledarja:
            <div class="calendar-widget">
                <input type="date" id="datePickerInput">
                <button onclick="submitDate()">Potrdi izbiro datuma</button>
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Napišite sporočilo..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Pošlji</button>
    </div>
</div>

<script>
    function appendMessage(text, sender) {
        const chatMessages = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if (text === '') return;

        // Uporabnikovo sporočilo
        appendMessage(text, 'user');
        inputField.value = '';

        // Simulacija odgovora AI-ja
        setTimeout(() => {
            appendMessage('Hvala. Zabeležil sem vaš vnos. Želite še kakšno prilagoditev?', 'ai');
        }, 1000);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function submitDate() {
        const dateInput = document.getElementById('datePickerInput');
        const selectedDate = dateInput.value;

        if (!selectedDate) {
            alert('Prosimo, najprej izberite datum v koledarju!');
            return;
        }

        // Oblikovanje datuma v lepši slovenski zapis (npr. DD. MM. LLLL)
        const parts = selectedDate.split('-');
        const formattedDate = `${parts[2]}.${parts[1]}.${parts[0]}`;

        // Prikažemo izbiro kot uporabnikovo sporočilo v klepetu
        appendMessage(`Izbral sem datum: ${formattedDate}`, 'user');

        // Odstranimo gradnik koledarja, da ne moti več
        const calendarMsg = document.getElementById('calendarPromptMessage');
        if (calendarMsg) {
            calendarMsg.style.display = 'none';
        }

        // Odgovor AI-ja po izbiri datuma
        setTimeout(() => {
            appendMessage(`Odlično! Uspešno ste izbrali datum ${formattedDate}. Kako lahko pomagam naprej?`, 'ai');
        }, 1000);
    }
</script>

</body>
</html>
